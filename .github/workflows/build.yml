name: Checks, builds and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: ${{ matrix.target }} x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux
          - os: windows-2022
            target: windows
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: 'tools/*/pom.xml'
      - run: npm ci
      - run: npm run setup:electron
      - run: npm run check
      - name: Install Chromium and Linux system dependencies
        if: runner.os == 'Linux'
        run: node scripts/playwright.mjs install --with-deps chromium
      - name: Install Chromium on Windows
        if: runner.os == 'Windows'
        run: npm run setup:e2e
      - run: npm run package:${{ matrix.target }}
      - name: Enable Electron sandbox on the ephemeral Linux runner
        if: runner.os == 'Linux'
        run: |
          if [[ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Test UI, Electron and AppImage on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:e2e
      - name: Test UI, Electron and packaged EXE on Windows
        if: runner.os == 'Windows'
        run: npm run test:e2e -- --project=chromium --project=electron --project=windows
      - name: Test against an independent Flowable runtime on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:runtime
      - name: Test against an independent Flowable runtime on Windows
        if: runner.os == 'Windows'
        run: npm run test:runtime
      - run: npm run validate:flowable
      - run: npm run validate:camunda
      - name: Upload verified distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bpmn-desk-${{ matrix.target }}-x64
          path: |
            release/*.AppImage
            release/*-Setup.exe
            release/*-Portable.exe
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload failed test diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.target }}
          path: test-results/
          retention-days: 7

  release:
    name: Publish release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bpmn-desk-*-x64
          merge-multiple: true
          path: release
      - name: Verify release assets and version and generate SHA256SUMS
        run: node scripts/release-manifest.mjs
      - name: Create draft, upload assets and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_VERSION=$(node -p "require('./package.json').version")
          node scripts/release-notes.mjs > "$RUNNER_TEMP/bpmn-desk-release-notes.md"
          printf '\n\nBuild and checks: %s/%s/actions/runs/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$RUNNER_TEMP/bpmn-desk-release-notes.md"
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft \
            --title "BPMN Desk $RELEASE_VERSION" --notes-file "$RUNNER_TEMP/bpmn-desk-release-notes.md"
          gh release upload "$GITHUB_REF_NAME" release/*.AppImage release/*-Setup.exe release/*-Portable.exe release/SHA256SUMS
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
